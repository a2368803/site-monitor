name: 網站健康檢查

on:
  schedule:
    # 每 5 分鐘檢查一次（GitHub 實際排程可能延遲數分鐘，屬正常）
    - cron: '*/5 * * * *'
  workflow_dispatch:        # 允許手動觸發

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查所有網站
        id: check
        run: |
          # 要監控的網址，一行一個
          SITES="
          https://wada.co.za
          https://wada-kaohsiung.vercel.app
          https://bangbangcat-kaohsiung.vercel.app
          https://wadatable.vercel.app
          https://kaohsiung-cat-map.vercel.app
          https://wada.co.za/__notify_test2__
          "

          FAILED=""
          REPORT=""

          for url in $SITES; do
            [ -z "$url" ] && continue

            # 重試 2 次，避免單次網路抖動就誤報
            code=""
            for attempt in 1 2; do
              code=$(curl -sS -o /tmp/body.html -w "%{http_code}" -L \
                     --max-time 25 --retry 1 "$url" 2>/dev/null || echo "000")
              [ "$code" = "200" ] && break
              sleep 5
            done

            if [ "$code" = "200" ]; then
              # 200 還不夠：確認頁面真的有內容，不是空白頁或錯誤 JSON
              size=$(wc -c < /tmp/body.html)
              if [ "$size" -lt 500 ]; then
                FAILED="${FAILED}- ${url} — HTTP 200 但內容只有 ${size} bytes（疑似空白頁）\n"
                REPORT="${REPORT}異常 ${url} (200 但內容過短)\n"
              elif grep -qi 'usage_exceeded\|Service Unavailable\|Account Suspended' /tmp/body.html; then
                FAILED="${FAILED}- ${url} — 回傳了停權/超額錯誤訊息\n"
                REPORT="${REPORT}異常 ${url} (停權訊息)\n"
              else
                REPORT="${REPORT}正常 ${url} (200, ${size} bytes)\n"
              fi
            else
              FAILED="${FAILED}- ${url} — HTTP ${code}\n"
              REPORT="${REPORT}異常 ${url} (HTTP ${code})\n"
            fi
          done

          echo -e "$REPORT"
          {
            echo "report<<EOF"
            echo -e "$REPORT"
            echo "EOF"
            echo "failed<<EOF"
            echo -e "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED" ]; then exit 1; fi

      - name: 網站異常時開 issue 通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const failed = `${{ steps.check.outputs.failed }}`;
            const report = `${{ steps.check.outputs.report }}`;
            const title = '🔴 網站異常';
            const body = [
              '偵測時間：' + new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
              '',
              '## 有問題的網站',
              failed || '(無詳細資訊)',
              '',
              '## 完整檢查結果',
              '```',
              report,
              '```',
              '',
              '網站恢復後，這張 issue 會自動關閉。',
              '',
              '[查看這次檢查的紀錄](' +
                `https://github.com/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId})`
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime'
            });

            if (open.data.length > 0) {
              // 已經有開著的故障單，補一則留言就好，避免洗版
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              // 指派給擁有者 — 被指派一定會收到通知信，
              // 不必依賴有沒有 watch 這個 repo
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['uptime'],
                assignees: [context.repo.owner]
              });
            }

      - name: 網站恢復時自動關閉 issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime'
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ 所有網站已恢復正常（' +
                      new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) + '）'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed'
              });
            }
